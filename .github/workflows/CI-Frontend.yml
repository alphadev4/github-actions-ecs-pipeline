name: Frontend CI
on:
  pull_request:
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: frontend
jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "Scanning range origin/${{ github.base_ref }}..HEAD"
          gitleaks detect --source . --redact --verbose \
            --log-opts="origin/${{ github.base_ref }}..HEAD"
  lint:
    name: Lint & format (eslint + prettier)
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
  test:
    name: Tests (vitest)
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
