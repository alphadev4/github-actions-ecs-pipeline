name: New-Dev CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/*'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: 'read'
  packages: write

jobs:
  changes:
    runs-on: ubicloud-standard-4
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.filter-manual.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.filter-manual.outputs.frontend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure || steps.filter-manual.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend-2/**'
            infrastructure:
              - 'infrastructure/**'

      - name: Set all outputs for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: filter-manual
        run: |
          echo "backend=true" >> $GITHUB_OUTPUT
          echo "frontend=true" >> $GITHUB_OUTPUT
          echo "infrastructure=true" >> $GITHUB_OUTPUT

  # CI Jobs
  build-and-push-backend:
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true'
    needs: changes
    runs-on: ubicloud-standard-4
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./backend/Dockerfile
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend-new-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-amplify:
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infrastructure == 'true'
    needs: changes
    runs-on: ubicloud-standard-4
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-2/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          rm -rf node_modules/.cache
          rm -rf .next
          npm ci --cache .npm --prefer-offline

      - name: Build frontend
        working-directory: ./frontend-2
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.REACT_APP_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.REACT_APP_WS_URL }}
          NEXT_PUBLIC_VENDOR_API_URL: ${{ secrets.REACT_APP_VENDOR_API_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.REACT_APP_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.REACT_APP_AUTH0_CLIENTID }}
          NEXT_PUBLIC_AUTH0_SCOPE: ${{ secrets.REACT_APP_AUTH0_SCOPE }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.REACT_APP_AUTH0_AUDIENCE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CSP_ENABLED: ${{ vars.CSP_ENABLED }}
          CSP_API_DOMAIN: ${{ vars.CSP_API_DOMAIN }}
          CSP_SCRIPT_SOURCES: ${{ vars.CSP_SCRIPT_SOURCES }}
          CSP_ANALYTICS_DOMAINS: ${{ vars.CSP_ANALYTICS_DOMAINS }}
          CSP_STYLE_SOURCES: ${{ vars.CSP_STYLE_SOURCES }}
          CSP_FONT_SOURCES: ${{ vars.CSP_FONT_SOURCES }}
          CSP_CONNECT_SOURCES: ${{ vars.CSP_CONNECT_SOURCES }}
          CSP_FRAME_SOURCES: ${{ vars.CSP_FRAME_SOURCES }}
          CSP_MANIFEST_DOMAIN: ${{ vars.CSP_MANIFEST_DOMAIN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: |
          npm run build
          node scripts/resolve-next-symlinks.js

      - name: Configure AWS credentials from GitHub OIDC
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_FRONTEND2_ROLE_AMPLIFY_BUILD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger Amplify deployment
        run: |
          AMPLIFY_BRANCH="${{ github.ref_name }}"
          
          echo "Starting Amplify Deployment"
          echo "Branch: $AMPLIFY_BRANCH"
          
          JOB_ID=$(aws amplify start-job \
            --app-id dexample123456 \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --region us-east-1 \
            --query 'jobSummary.jobId' \
            --output text)
          
          echo "Amplify job started - Job ID: $JOB_ID"
          
          while true; do
            STATUS=$(aws amplify get-job \
              --app-id dexample123456 \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --region us-east-1 \
              --query 'job.summary.status' \
              --output text)
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "Amplify deployment completed successfully"
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify deployment failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
          done
     
  backend-ecs-update:
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true'
    needs: [changes, build-and-push-backend]
    runs-on: ubicloud-standard-4
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to ECS
        uses: donaldpiret/ecs-deploy@v0.2.0
        with:
          cluster: sample-app-new-dev-ecs-cluster
          target: sample-app-be-new-service
          tag: ${{ github.sha }}
          rollback: true
          timeout: 900

  celery-worker-ecs-update:
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true'
    needs: [changes, build-and-push-backend]
    runs-on: ubicloud-standard-4
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy celery worker
        uses: donaldpiret/ecs-deploy@v0.2.0
        with:
          cluster: sample-app-new-dev-ecs-cluster
          target: sample-app-celery-worker-new-service
          tag: ${{ github.sha }}
          rollback: true
          timeout: 900

  celery-beat-ecs-update:
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true'
    needs: [changes, build-and-push-backend]
    runs-on: ubicloud-standard-4
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to ECS
        uses: donaldpiret/ecs-deploy@v0.2.0
        with:
          cluster: sample-app-new-dev-ecs-cluster
          target: sample-app-celery-beat-new-service
          tag: ${{ github.sha }}
          rollback: true
          timeout: 900

  update-tracker-status:
    runs-on: ubicloud-standard-4
    environment: dev
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.deploy-frontend-amplify.result  == 'success' ||
        needs.backend-ecs-update.result       == 'success' ||
        needs.celery-worker-ecs-update.result == 'success' ||
        needs.celery-beat-ecs-update.result   == 'success'
      )
    needs:
      - deploy-frontend-amplify
      - backend-ecs-update
      - celery-worker-ecs-update
      - celery-beat-ecs-update
    steps:
      - name: Checkout release branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Extract Tracker task IDs from merge commits since last deployment
        id: extract
        run: |
          echo "Scanning merge commits for Tracker task IDs"
          echo "Current SHA : ${{ github.sha }}"

          PREV_SHA=$(git log --merges --format="%H" | sed -n '2p')

          if [ -z "$PREV_SHA" ]; then
            echo "No previous merge commit found — scanning last 50 commits as fallback."
            RANGE="HEAD~50..HEAD"
          else
            echo "Previous merge commit SHA: $PREV_SHA"
            RANGE="$PREV_SHA..HEAD"
          fi

          echo "Commit range: $RANGE"
          echo ""
          echo "Merge commits in range:"
          git log "$RANGE" --merges --oneline

          RAW_IDS=$(git log "$RANGE" --merges --format="%s %b" \
            | grep -oP '(?<=TKT-)[a-zA-Z0-9]+' \
            | sort -u)

          echo ""
          if [ -z "$RAW_IDS" ]; then
            echo "No Tracker task IDs found in merge commits. Skipping silently."
            echo "ticket_ids=" >> $GITHUB_OUTPUT
          else
            TICKET_IDS=$(echo "$RAW_IDS" | tr '\n' ',' | sed 's/,$//')
            echo "Found Tracker task IDs: $TICKET_IDS"
            echo "ticket_ids=$TICKET_IDS" >> $GITHUB_OUTPUT
          fi

      - name: Update each Tracker task to "Ready for QA"
        if: steps.extract.outputs.ticket_ids != ''
        run: |
          echo "Updating Tracker tasks to: ready for qa"

          IFS=',' read -ra TICKET_IDS <<< "${{ steps.extract.outputs.ticket_ids }}"

          FAILED=0
          SUCCESS=0

          for TICKET_ID in "${TICKET_IDS[@]}"; do
            echo "→ Updating task: $TICKET_ID"

            HTTP_STATUS=$(curl -s \
              -o /tmp/tkt_response_${TICKET_ID}.json \
              -w "%{http_code}" \
              -X PUT "https://tracker.example.com/api/v2/task/${TICKET_ID}" \
              -H "Authorization: ${{ secrets.TRACKER_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"status": "ready for qa"}')

            RESPONSE_BODY=$(cat /tmp/tkt_response_${TICKET_ID}.json)

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "  Task $TICKET_ID → ready for qa (HTTP $HTTP_STATUS)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  Task $TICKET_ID failed to update status (HTTP $HTTP_STATUS)"
              echo "  Response: $RESPONSE_BODY"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Tracker Update Summary"
          echo "  Total : ${#TICKET_IDS[@]}"
          echo "  OK    : $SUCCESS"
          echo "  ERR   : $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "   $FAILED task(s) failed to update status in Tracker."
            echo "   Deployment succeeded but Tracker was not updated."
            echo "   Please update the task(s) manually or re-run this job."
            exit 1
          fi
