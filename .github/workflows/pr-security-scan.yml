name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging, dev, release/sprint-11]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    uses: example-org/.github/.github/workflows/pr-security-scan.yml@main
    secrets: inherit
